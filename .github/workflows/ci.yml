name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # The stub provider keeps tests + evals offline and deterministic.
      LLM_PROVIDER: stub
      # Real keys aren't required for stub mode; the config loader still
      # reads these to construct settings, so we feed it harmless dummies.
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_ANON_KEY: dummy
      SUPABASE_SERVICE_ROLE_KEY: dummy
      SUPABASE_JWT_SECRET: dummy-secret-for-ci-only
      ANTHROPIC_API_KEY: dummy
      OPENAI_API_KEY: dummy
      FRONTEND_ORIGIN: http://localhost:5173
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: pip install -r requirements.txt
      - name: Run pytest
        run: pytest -q
      - name: Run eval harness
        run: python evals/run_evals.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Build
        # VITE_* env vars aren't needed for a type-check + bundle pass; the
        # client gracefully degrades when VITE_API_BASE_URL is undefined at
        # build time (it's read at request time, not bundle time).
        run: npm run build
